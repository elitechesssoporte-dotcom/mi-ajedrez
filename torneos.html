<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneos - FighterChess</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #050505; 
            color: #c0c0c0; 
            font-family: 'Inter', sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .nav-top {
            margin-bottom: 10px;
            width: fit-content;
        }
        .nav-top a {
            color: #888;
            text-decoration: none;
            font-size: 0.75em;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .nav-top a:hover { 
            color: #d4af37; 
            background: rgba(212, 175, 55, 0.1);
        }
        
        .main-container {
            max-width: 900px; /* ✅ Aumentado para acomodar 2 columnas */
            margin: 0 auto;
        }
        
        h1 {
            color: #d4af37;
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.6em;
        }

        /* ✅ NUEVO: Grid para las dos columnas */
        .torneos-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .crear-torneo-box {
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            height: 100%; /* Para que ambas cajas tengan la misma altura */
            display: flex;
            flex-direction: column;
        }
        
        .crear-torneo-box h2 {
            color: #d4af37;
            margin-bottom: 15px;
            font-size: 1.2em;
            text-align: center;
        }
        
        .crear-torneo-box input, .crear-torneo-box select {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #000;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-size: 0.95em;
        }
        
        .btn-crear {
            width: 100%;
            padding: 14px;
            background: #d4af37;
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: 0.3s;
            margin-top: auto; /* Empuja el botón al fondo */
        }
        .btn-crear:hover { 
            background: #f0d060; 
            transform: translateY(-2px); 
        }

        /* Estilo distintivo para el botón suizo */
        .btn-suizo {
            background: #9c27b0;
            color: white;
        }
        .btn-suizo:hover {
            background: #ba68c8;
        }

        .lista-torneos-box {
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
        }
        .lista-torneos-box h2 {
            color: #d4af37;
            margin-bottom: 15px;
            font-size: 1.2em;
            text-align: center;
        }
        .torneo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #d4af37;
        }
        .torneo-item.suizo {
            border-left-color: #9c27b0; /* Borde morado para torneos suizos */
        }
        .torneo-info h3 { 
            color: white; 
            margin-bottom: 5px; 
            font-size: 1.05em; 
        }
        .torneo-info p { 
            color: #888; 
            font-size: 0.85em; 
        }
        .btn-unirse {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            white-space: nowrap;
            margin-left: 10px;
            font-size: 0.9em;
        }
        .btn-unirse:hover { 
            background: #45a049; 
            transform: scale(1.05); 
        }
        
        .mensaje-exito {
            background: #1a3a1a;
            border: 1px solid #4CAF50;
            color: #4CAF50;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ✅ RESPONSIVE: En móvil, una columna debajo de la otra */
        @media (max-width: 768px) {
            body { padding: 15px; }
            .main-container { max-width: 100%; }
            .torneos-grid {
                grid-template-columns: 1fr; /* Apilar verticalmente */
                gap: 15px;
            }
            h1 { font-size: 1.4em; }
            .torneo-item { 
                flex-direction: column; 
                gap: 12px; 
                text-align: center; 
            }
            .btn-unirse { 
                margin-left: 0; 
                width: 100%; 
            }
        }
    </style>
</head>
<body>
    <div class="nav-top">
        <a href="configuracion.html">← Volver a Configuración</a>
    </div>

    <div class="main-container">
        <h1>🏆 Torneos FighterChess</h1>

        <!-- ✅ NUEVO: Grid de dos columnas -->
        <div class="torneos-grid">
            <!-- Columna Izquierda: Torneo Normal -->
            <div class="crear-torneo-box">
                <h2>⚡ Crear Torneo Normal</h2>
                <input type="text" id="nombreTorneoInput" placeholder="Nombre del Torneo">
                <select id="tiempoTorneoInput">
                    <option value="1">1 min (Bullet)</option>
                    <option value="3">3 min (Bullet)</option>
                    <option value="5" selected>5 min (Blitz)</option>
                    <option value="10">10 min (Rapid)</option>
                    <option value="15">15 min (Rapid)</option>
                </select>
                <input type="number" id="duracionTorneoInput" value="30" min="5" max="120" placeholder="Duración en minutos">
                <button class="btn-crear" onclick="crearTorneo()">Crear Torneo Normal</button>
            </div>

            <!-- Columna Derecha: Torneo Suizo -->
            <div class="crear-torneo-box">
                <h2>🇨🇭 Crear Torneo Suizo</h2>
                <input type="text" id="nombreSuizoInput" placeholder="Nombre del Torneo Suizo">
                <select id="tiempoSuizoInput">
                    <option value="1">1 min (Bullet)</option>
                    <option value="3">3 min (Bullet)</option>
                    <option value="5" selected>5 min (Blitz)</option>
                    <option value="10">10 min (Rapid)</option>
                    <option value="15">15 min (Rapid)</option>
                </select>
                <input type="number" id="rondasSuizoInput" value="5" min="3" max="9" placeholder="Número de Rondas">
                <button class="btn-crear btn-suizo" onclick="crearTorneoSuizo()">Crear Torneo Suizo</button>
            </div>
        </div>

        <div class="lista-torneos-box">
            <h2>📋 Torneos Activos</h2>
            <div id="listaTorneos">
                <p style="color:#888; text-align:center; padding: 20px;">No hay torneos activos en este momento</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io();
        
        socket.on('connect', function() {
            console.log("✅ Conectado a torneos");
            setTimeout(() => { socket.emit('pedir_torneos'); }, 500);
        });

        // --- TORNEO NORMAL ---
        function crearTorneo() {
            const nombre = document.getElementById('nombreTorneoInput').value.trim();
            const tiempo = parseInt(document.getElementById('tiempoTorneoInput').value);
            const duracion = parseInt(document.getElementById('duracionTorneoInput').value) * 60;
            const miNick = localStorage.getItem('nickJugador');

            if (!nombre) { alert("⚠️ Por favor, pon un nombre al torneo"); return; }
            if (!miNick) { alert("⚠️ Debes iniciar sesión primero"); window.location.href = "login.html"; return; }

            console.log("⚡ Creando torneo normal:", nombre);
            socket.emit('crear_torneo', {
                nombre: nombre,
                tiempo: tiempo,
                duracion: duracion,
                creador: miNick,
                tipo: 'normal'
            });
        }

        // --- TORNEO SUIZO (NUEVO) ---
        function crearTorneoSuizo() {
    const nombre = document.getElementById('nombreSuizoInput').value.trim();
    const tiempo = parseInt(document.getElementById('tiempoSuizoInput').value);
    const rondas = parseInt(document.getElementById('rondasSuizoInput').value);
    const miNick = localStorage.getItem('nickJugador');

    if (!nombre) { alert("⚠️ Por favor, pon un nombre al torneo"); return; }
    if (!miNick) { alert("⚠️ Debes iniciar sesión primero"); window.location.href = "login.html"; return; }

    // ✅ AÑADIR ESTA LÍNEA
    localStorage.setItem('creadorTorneo', miNick);

    console.log("🇨🇭 Creando torneo suizo:", nombre);
    socket.emit('crear_torneo_suizo', {
        nombre: nombre,
        tiempo: tiempo,
        rondas: rondas,
        creador: miNick,
        tipo: 'suizo'
    });
}

        // ✅ MODIFICADO: Maneja la creación de ambos tipos
        socket.on('torneo_creado', function(data) {
            console.log("✅ Torneo creado:", data);
            
            localStorage.setItem('torneoActual', data.torneo_id);
            localStorage.setItem('nombreTorneo', data.nombre);
            localStorage.setItem('tipoTorneo', data.tipo || 'normal');
            
            const tiempo = data.tipo === 'suizo' ? document.getElementById('tiempoSuizoInput').value : document.getElementById('tiempoTorneoInput').value;
            
            localStorage.setItem('tiempoTorneo', tiempo + '+0');
            if (data.tipo === 'suizo') {
                localStorage.setItem('rondasSuizo', document.getElementById('rondasSuizoInput').value);
            } else {
                localStorage.setItem('duracionTorneo', document.getElementById('duracionTorneoInput').value * 60);
            }
            
            // Mostrar mensaje de éxito
            const contenedor = document.querySelector('.main-container');
            const mensaje = document.createElement('div');
            mensaje.className = 'mensaje-exito';
            const tipoTexto = data.tipo === 'suizo' ? 'Suizo' : 'Normal';
            mensaje.innerHTML = `✅ Torneo ${tipoTexto} "${data.nombre}" creado exitosamente. ¡Únete desde la lista de abajo!`;
            contenedor.insertBefore(mensaje, contenedor.firstChild);
            
            setTimeout(() => {
                mensaje.style.opacity = '0';
                setTimeout(() => mensaje.remove(), 300);
            }, 5000);
            
            // Limpiar formularios
            document.getElementById('nombreTorneoInput').value = '';
            document.getElementById('nombreSuizoInput').value = '';
            
            socket.emit('pedir_torneos');
        });

        socket.on('lista_torneos_actualizada', function(lista) {
            const contenedor = document.getElementById('listaTorneos');
            if (!lista || lista.length === 0) {
                contenedor.innerHTML = '<p style="color:#888; text-align:center; padding: 20px;">No hay torneos activos en este momento</p>';
                return;
            }
            
            let html = '';
            lista.forEach(t => {
                const esSuizo = t.tipo === 'suizo';
                const claseExtra = esSuizo ? 'suizo' : '';
                const infoExtra = esSuizo ? `| 🔄 ${t.rondas || 5} rondas` : `| ⏱️ ${t.tiempo} min`;
                
                html += `
                    <div class="torneo-item ${claseExtra}">
                        <div class="torneo-info">
                            <h3>${esSuizo ? '🇨🇭' : '⚡'} ${t.nombre}</h3>
                            <p>👥 ${t.jugadores} jugadores ${infoExtra}</p>
                        </div>
                        <button class="btn-unirse" onclick="unirseTorneo('${t.id}', '${t.nombre}', ${t.tiempo}, '${t.tipo || 'normal'}', ${t.rondas || 0})">
                            Unirse
                        </button>
                    </div>
                `;
            });
            contenedor.innerHTML = html;
        });

        function unirseTorneo(id, nombre, tiempo, tipo, rondas) {
    console.log(" Uniéndose al torneo:", nombre, "Tipo:", tipo);
    localStorage.setItem('torneoActual', id);
    localStorage.setItem('nombreTorneo', nombre);
    localStorage.setItem('tipoTorneo', tipo || 'normal');
    localStorage.setItem('tiempoTorneo', tiempo + '+0');
    
    if (tipo === 'suizo') {
        localStorage.setItem('rondasSuizo', rondas || 5);
        window.location.href = "sala_torneo_suizo.html";
    } else {
        localStorage.setItem('duracionTorneo', 1800); // Valor por defecto
        window.location.href = "sala_torneo.html";
    }
}
    </script>
</body>
</html>
