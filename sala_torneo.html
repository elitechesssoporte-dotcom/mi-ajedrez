<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala del Torneo - FighterChess</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #050505; color: white; 
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #151515;
            border-radius: 12px;
            border: 1px solid #333;
        }
        .header h1 {
            color: #d4af37;
            font-size: 2em;
            margin-bottom: 10px;
        }
        .tournament-info {
            display: flex;
            justify-content: center;
            gap: 30px;
            color: #888;
            font-size: 0.9em;
            flex-wrap: wrap;
        }
        .tournament-info span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .box {
            background: #151515;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
        }
        .box h2 {
            color: #d4af37;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .player-row {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 5px;
            background: #222;
            border-radius: 6px;
            align-items: center;
        }
        .player-row.me {
            border-left: 3px solid #d4af37;
            background: #2a2515;
        }
        .player-rank {
            font-weight: bold;
            color: #d4af37;
            width: 30px;
        }
        .player-name {
            flex: 1;
            margin-left: 10px;
        }
        .player-points {
            font-weight: bold;
            color: #d4af37;
        }
        .status-box {
            text-align: center;
            padding: 30px;
            margin-top: 20px;
            background: #151515;
            border-radius: 12px;
            border: 1px solid #333;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .status-text {
            font-size: 1.3em;
            color: #d4af37;
            margin-bottom: 20px;
        }
        .btn-search {
            background: #d4af37;
            color: #000;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-search:hover {
            background: #f0d060;
            transform: translateY(-2px);
        }
        .btn-search:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }
        .nav-top {
            position: absolute;
            top: 20px;
            left: 20px;
        }
        .nav-top a {
            color: #888;
            text-decoration: none;
            font-size: 0.9em;
        }
        .nav-top a:hover {
            color: #d4af37;
        }
        .timer {
            font-size: 1.5em;
            font-weight: bold;
            color: #d4af37;
            font-family: monospace;
        }
        
        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.5em; }
            .tournament-info { gap: 15px; font-size: 0.8em; }
        }
    </style>
</head>
<body>

    <div class="nav-top">
        <a href="configuracion.html">← Volver a configuración</a>
    </div>

    <div class="header">
        <h1 id="nombreTorneo">🏆 Cargando torneo...</h1>
        <div class="tournament-info">
            <span>⏱️ Ritmo: <span id="tiempoTorneo">-</span></span>
            <span>⏰ <span class="timer" id="tiempoRestante">30:00</span></span>
            <span>👥 <span id="numJugadores">0</span> jugadores</span>
        </div>
    </div>

    <div class="main-grid">
        <div class="box">
            <h2>📊 Clasificación</h2>
            <div id="clasificacion">
                <p style="text-align: center; color: #555; padding: 20px;">Esperando jugadores...</p>
            </div>
        </div>

        <div class="box">
            <h2>👥 Jugadores en sala</h2>
            <div id="jugadores">
                <p style="text-align: center; color: #555; padding: 20px;">Cargando...</p>
            </div>
        </div>
    </div>

    <div class="status-box">
        <div class="status-text" id="statusText">⏳ Esperando rivales...</div>
        <button class="btn-search" id="btnBuscar" onclick="buscarPartida(false)">
            🔍 BUSCAR PARTIDA
        </button>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        console.log("🚀 SALA DE TORNEO CARGADA");

        const torneoId = localStorage.getItem('torneoActual');
        const miNick = localStorage.getItem('nickJugador');
        const nombreTorneo = localStorage.getItem('nombreTorneo') || 'Torneo';
        const tiempoTorneo = localStorage.getItem('tiempoTorneo') || '5+0';
        const duracionTorneo = parseInt(localStorage.getItem('duracionTorneo')) || 1800;

        if (!torneoId) {
            alert("⚠️ No has seleccionado ningún torneo");
            window.location.href = "configuracion.html";
        }
        if (!miNick) {
            alert("⚠️ Debes iniciar sesión");
            window.location.href = "login.html";
        }

        document.getElementById('nombreTorneo').textContent = `🏆 ${nombreTorneo}`;
        document.getElementById('tiempoTorneo').textContent = tiempoTorneo;

        const socket = io();
        let estoyBuscando = false;

        // ✅ REGISTRARSE Y EMPAREJAR AUTOMÁTICAMENTE AL CONECTAR
        socket.on('connect', function() {
            console.log("✅ Conectado, registrando sesión en torneo...");
            socket.emit('registrar_sesion_torneo', { nick: miNick });
            
            socket.emit('unirse_torneo', {
                torneo_id: torneoId,
                jugador: miNick
            });

            // Intentar emparejamiento automático después de 1 segundo
            setTimeout(() => {
                console.log("🔄 Intentando emparejamiento automático...");
                buscarPartida(true);
            }, 1000);
        });

        // ✅ ESCUCHAR ACTUALIZACIONES
        socket.on('clasificacion_torneo', function(data) {
            console.log("📊 Clasificación recibida:", data);
            actualizarClasificacion(data);
        });

        socket.on('jugadores_torneo', function(data) {
            console.log("👥 Jugadores recibidos:", data);
            actualizarJugadores(data);
            document.getElementById('numJugadores').textContent = data.length;
        });

        socket.on('partida_torneo_encontrada', function(data) {
            console.log("🎉 PARTIDA ENCONTRADA:", data);
            localStorage.setItem('salaId', data.sala);
            localStorage.setItem('miColor', data.color);
            localStorage.setItem('rivalNick', data.rival_nick);
            localStorage.setItem('esTorneo', 'true');
            localStorage.setItem('torneoActual', data.torneo_id);
            
            // GUARDAR LOS ELOS CORRECTOS EN EL NAVEGADOR
            if (data.mi_elo) localStorage.setItem('miElo', data.mi_elo);
            if (data.rival_elo) localStorage.setItem('rivalElo', data.rival_elo);
            
            window.location.href = "tablero.html";
        });

        // Cuando no hay rival con puntos similares disponible
        socket.on('sin_rival_disponible', function() {
            console.log("⏳ No hay rival libre con tus puntos. Esperando...");
            estoyBuscando = false;
            document.getElementById('btnBuscar').disabled = false;
            document.getElementById('btnBuscar').textContent = "🔍 BUSCAR PARTIDA";
            document.getElementById('statusText').textContent = "⏳ Esperando rivales libres...";
        });

        // Cuando el servidor dice que puedes buscar de nuevo (ej: tras terminar partida)
        socket.on('puedes_buscar', function() {
            console.log("✅ Puedes buscar de nuevo");
            estoyBuscando = false;
            document.getElementById('btnBuscar').disabled = false;
            document.getElementById('btnBuscar').textContent = "🔍 BUSCAR PARTIDA";
            document.getElementById('statusText').textContent = "⏳ Esperando rivales...";
            
            // Reintentar emparejar automáticamente de nuevo tras terminar partida
            setTimeout(() => {
                console.log("🔄 Reintentando emparejamiento automático tras partida...");
                buscarPartida(true);
            }, 1500);
        });

        // ✅ FUNCIONES DE ACTUALIZACIÓN VISUAL
        function actualizarClasificacion(clasificacion) {
            const contenedor = document.getElementById('clasificacion');
            if (!clasificacion || clasificacion.length === 0) {
                contenedor.innerHTML = '<p style="text-align: center; color: #555; padding: 20px;">Sin clasificaciones aún</p>';
                return;
            }
            
            let html = '';
            clasificacion.forEach((jugador, index) => {
                const esYo = jugador.nick === miNick ? 'me' : '';
                const medalla = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}º`;
                
                html += `
                    <div class="player-row ${esYo}">
                        <span class="player-rank">${medalla}</span>
                        <span class="player-name">
                            ${jugador.nick} ${esYo ? '(Tú)' : ''}
                            <span style="color: #888; font-size: 0.85em; margin-left: 8px;">ELO: ${jugador.elo || 1200}</span>
                        </span>
                        <span class="player-points">${jugador.puntos} pts</span>
                    </div>
                `;
            });
            contenedor.innerHTML = html;
        }

        function actualizarJugadores(jugadores) {
            const contenedor = document.getElementById('jugadores');
            if (!jugadores || jugadores.length === 0) {
                contenedor.innerHTML = '<p style="text-align: center; color: #555; padding: 20px;">Sin jugadores</p>';
                return;
            }
            
            let html = '';
            jugadores.forEach(jugador => {
                const esYo = jugador === miNick ? 'me' : '';
                html += `
                    <div class="player-row ${esYo}">
                        <span class="player-name">${jugador} ${esYo ? '(Tú)' : ''}</span>
                    </div>
                `;
            });
            contenedor.innerHTML = html;
        }

        // ✅ BUSCAR PARTIDA (Manual o Automática)
        function buscarPartida(automatico = false) {
            if (estoyBuscando) return;
            
            console.log(`🔍 Buscando partida en torneo: ${torneoId} (Automático: ${automatico})`);
            estoyBuscando = true;
            
            if (!automatico) {
                document.getElementById('btnBuscar').disabled = true;
                document.getElementById('btnBuscar').textContent = "⏳ BUSCANDO...";
                document.getElementById('statusText').textContent = "🔍 Buscando rival...";
            } else {
                document.getElementById('statusText').textContent = "🔄 Buscando rival automáticamente...";
            }
            
            socket.emit('buscar_partida_torneo', {
                torneo_id: torneoId,
                jugador: miNick,
                automatico: automatico
            });
        }

        // ✅ TEMPORIZADOR DEL TORNEO
        let tiempoRestante = duracionTorneo;
        const timerElement = document.getElementById('tiempoRestante');
        let intervaloTorneo = null;

        function iniciarTemporizador() {
            if (intervaloTorneo) clearInterval(intervaloTorneo);
            
            intervaloTorneo = setInterval(() => {
                if (tiempoRestante <= 0) {
                    clearInterval(intervaloTorneo);
                    timerElement.textContent = "00:00";
                    document.getElementById('statusText').textContent = "🏁 ¡Torneo finalizado!";
                    document.getElementById('btnBuscar').disabled = true;
                    document.getElementById('btnBuscar').textContent = "TORNEO FINALIZADO";
                    return;
                }
                
                tiempoRestante--;
                const m = Math.floor(tiempoRestante / 60);
                const s = Math.floor(tiempoRestante % 60);
                timerElement.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }, 1000);
        }

        iniciarTemporizador();

        console.log("📡 Pidiendo tiempo real al servidor para torneo:", torneoId);
        socket.emit('obtener_tiempo_restante_torneo', { torneo_id: torneoId });

        socket.on('tiempo_restante_torneo', function(data) {
            console.log("📥 Respuesta del servidor recibida:", data);
            if (data.torneo_id === torneoId) {
                tiempoRestante = data.tiempo_restante;
                console.log('⏱️ Tiempo actualizado a:', tiempoRestante, 'segundos');
                
                const m = Math.floor(tiempoRestante / 60);
                const s = Math.floor(tiempoRestante % 60);
                timerElement.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
        });

        window.addEventListener('beforeunload', function() {
            if (intervaloTorneo) clearInterval(intervaloTorneo);
        });
    </script>
</body>
</html>
