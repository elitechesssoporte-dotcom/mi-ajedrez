<!DOCTYPE html>
<html lang="es">
<head>
<!-- Código para que sea una App (PWA) -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#050505">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FighterChess - Configuración</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        .jugador-cola {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .jugador-cola:hover {
            border-color: #c4a028;
            background: #222;
            transform: translateX(5px);
        }
        .jugador-info {
            display: flex;
            flex-direction: column;
            text-align: left;
            flex: 1;
        }
        .jugador-nick {
            font-weight: bold;
            color: #fff;
            font-size: 1.05em;
        }
        .jugador-elo {
            font-size: 0.85em;
            color: #c4a028;
            font-weight: bold;
            margin-top: 2px;
        }
        .jugador-ritmo {
            font-size: 0.8em;
            color: #888;
            margin-top: 1px;
        }
        .jugador-pais {
            font-size: 0.85em;
            color: #c4a028;
            margin-top: 2px;
        }
        .btn-unirse {
            background: #c4a028;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
        }
        .btn-unirse:hover {
            background: #d4af37;
        }
        body { 
            background: #050505; 
            color: #c0c0c0; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .contenedor-principal {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            align-items: flex-start;
        }
        .panel-izquierdo {
            width: 320px;
            background: #111; 
            padding: 25px; 
            border-radius: 15px; 
            border: 1px solid #333;
            flex-shrink: 0;
        }
        .panel-derecho {
            width: 300px;
            background: #111; 
            padding: 20px; 
            border-radius: 15px; 
            border: 1px solid #333;
            position: sticky;
            top: 20px;
            flex-shrink: 0;
        }
        .contador-box {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #c0c0c0;
        }
        .contador-box span {
            font-weight: bold;
            color: #4CAF50;
            font-size: 1.2em;
        }
        h2 { 
            color: #d4af37; 
            margin-bottom: 20px; 
            text-align: center;
            font-size: 1.3em;
        }
        .grid-tiempos { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            margin-bottom: 15px; 
        }
        .btn-tiempo { 
            padding: 10px; 
            background: #222; 
            border: 1px solid #444; 
            color: white; 
            cursor: pointer; 
            border-radius: 5px; 
            font-size: 0.95em;
        }
        .btn-tiempo:hover, .btn-tiempo.active { 
            background: #c4a028; 
            color: black; 
            font-weight: bold; 
        }
        label { 
            display: block; 
            margin-top: 12px; 
            font-size: 0.85rem; 
            text-align: left; 
        }
        input { 
            width: 100%; 
            padding: 8px; 
            margin-top: 5px; 
            border-radius: 5px; 
            background: #000; 
            color: white; 
            border: 1px solid #444; 
            box-sizing: border-box; 
            font-size: 0.9em;
        }
        #btn-jugar { 
            width: 100%; 
            padding: 12px; 
            background: #c4a028; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 20px; 
            font-size: 1em;
        }
        #btn-jugar:disabled { 
            background: #555; 
            cursor: not-allowed; 
        }
        #mensaje-espera { 
            color: #c4a028; 
            margin-top: 12px; 
            font-size: 0.85em; 
            display: none; 
            text-align: center;
        }
        .tiempo-personalizado {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .tiempo-personalizado input {
            flex: 1;
        }
        .tiempo-personalizado .unidad {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .tiempo-personalizado .unidad.active {
            background: #c4a028;
            color: black;
        }
        .titulo-cola {
            color: #c4a028;
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .lista-jugadores-container {
            max-height: 500px;
            overflow-y: auto;
        }

        /* Botones de navegación extra */
        .btn-nav {
            width: 100%;
            padding: 12px;
            background: #d4af37;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-nav:hover {
            background: #f0d060;
            transform: translateY(-2px);
        }
        .btn-nav.blue {
            background: #2196F3;
            color: white;
        }
        .btn-nav.blue:hover {
            background: #42a5f5;
        }

        @media (max-width: 900px) {
            .contenedor-principal {
                flex-direction: column;
            }
            .panel-izquierdo, .panel-derecho {
                width: 100%;
                position: static;
            }
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .panel-izquierdo, .panel-derecho { padding: 15px; }
            .grid-tiempos { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .btn-tiempo { padding: 12px 8px; font-size: 1em; }
        }
    </style>
</head>
<body>

<div class="contenedor-principal">
    <!-- Panel Izquierdo - Configuración -->
    <div class="panel-izquierdo">
        <h2>⚔️ TIEMPO DE PARTIDA</h2>
        
        <label>Elige los minutos:</label>
        <div class="grid-tiempos" id="selector-tiempo">
            <button class="btn-tiempo" onclick="seleccionarTiempo(1)">1</button>
            <button class="btn-tiempo" onclick="seleccionarTiempo(3)">3</button>
            <button class="btn-tiempo" onclick="seleccionarTiempo(5)">5</button>
            <button class="btn-tiempo" onclick="seleccionarTiempo(10)">10</button>
            <button class="btn-tiempo" onclick="seleccionarTiempo(15)">15</button>
            <button class="btn-tiempo" onclick="seleccionarTiempo(20)">20</button>
        </div>

        <label>Tiempo personalizado:</label>
        <div class="tiempo-personalizado">
            <input type="number" id="minutosPersonalizados" placeholder="Ej: 45, 60, 90..." min="1">
            <button class="unidad" id="btnMinutos" onclick="usarTiempoPersonalizado('minutos')">Min</button>
        </div>

        <label>Incremento (segundos):</label>
        <input type="number" id="incremento" value="0">

        <label>Elige tu color:</label>
        <div class="grid-tiempos" id="selector-color" style="display:none;">
            <button class="btn-tiempo" onclick="seleccionarColor('white')">♔ Blancas</button>
            <button class="btn-tiempo active" onclick="seleccionarColor('random')">🎲 Aleatorio</button>
            <button class="btn-tiempo" onclick="seleccionarColor('black')">♚ Negras</button>
        </div>

        <button id="btn-jugar" onclick="iniciarPartida()">🎮 JUGAR</button>
        <div id="mensaje-espera">⏳ Buscando rival...</div>
        <button id="btn-cancelar" onclick="cancelarBusqueda()" style="display:none; width:100%; padding:12px; background:#f44336; border:none; border-radius:5px; color:white; font-weight:bold; cursor:pointer; margin-top:10px;">
            ❌ Cancelar búsqueda
        </button>
        
        <!-- Botones de navegación -->
<button class="btn-nav" onclick="window.location.href='/clasificacion'" style="width:100%; margin-top:20px; margin-bottom:10px;">
    🏆 Clasificación
</button>

<button class="btn-nav" onclick="window.location.href='torneos.html'">
    🏆 Sala de Torneos
</button>

<button class="btn-nav blue" onclick="window.location.href='analisis.html'">
    🔍 Análisis con Stockfish
</button>
    </div>
    
    <!-- Panel Derecho - Contador + Lista de Jugadores -->
    <div class="panel-derecho">
        <div class="contador-box">
            🟢 Jugadores en línea: <span id="numero-conectados">0</span>
        </div>
        
        <h3 class="titulo-cola">👥 Jugadores Buscando Partida</h3>
        <div class="lista-jugadores-container" id="lista-jugadores">
            <p style="color: #666; text-align: center; padding: 20px;">No hay jugadores en espera.</p>
        </div>
    </div>
</div>

<!-- Registrar la App en el navegador -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('✅ App registrada correctamente'))
        .catch(err => console.log('❌ Error al registrar la app:', err));
    });
  }
</script>

<script>
    const socket = io();
    let tiempoElegido = 0;
    let colorElegido = 'random';
    let tiempoPersonalizadoActivo = false;
    let buscandoPartida = false;
    
    // 🏁 DICCIONARIO DE BANDERAS (CORREGIDO)
    const banderas = {
        'ES': '🇪🇸', 'MX': '🇲🇽', 'AR': '🇦🇷', 'CO': '🇨🇴', 'CL': '🇨🇱', 
        'PE': '🇵🇪', 'US': '🇺🇸', 'GB': '🇬🇧', 'FR': '🇫🇷', 'DE': '🇩🇪', 
        'IT': '🇮🇹', 'BR': '🇧🇷', 'PT': '🇵🇹', 'OT': '🌍'
    };
    
    socket.on('connect', function() {
        const nickGuardado = localStorage.getItem('nickJugador');
        const paisGuardado = localStorage.getItem('paisJugador');
        if (nickGuardado) {
            console.log('🔄 Re-registrando sesión de:', nickGuardado);
            socket.emit('reconectar_sesion', { nick: nickGuardado, pais: paisGuardado });
        }
        console.log('📡 Solicitando lista actualizada de la cola...');
        socket.emit('pedir_cola_espera');
    });

    socket.on('sesion_cerrada', function(data) {
        alert('⚠️ ' + data.mensaje);
        localStorage.clear();
        window.location.href = '/login.html';
    });

    socket.on('error_registro', function(data) {
        alert('⚠️ ' + data.mensaje);
    });

    socket.on('actualizar_contador', function(cantidad) {
        const spanContador = document.getElementById('numero-conectados');
        if (spanContador) spanContador.innerText = cantidad;
    });

    function seleccionarTiempo(minutos) {
        tiempoElegido = minutos;
        tiempoPersonalizadoActivo = false;
        document.getElementById('minutosPersonalizados').value = '';
        document.querySelectorAll('#selector-tiempo .btn-tiempo').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('selector-color').style.display = 'grid';
    }

    function usarTiempoPersonalizado(unidad) {
        const input = document.getElementById('minutosPersonalizados');
        const valor = parseInt(input.value);
        if (valor && valor > 0) {
            tiempoElegido = valor;
            tiempoPersonalizadoActivo = true;
            document.querySelectorAll('#selector-tiempo .btn-tiempo').forEach(b => b.classList.remove('active'));
            document.getElementById('btnMinutos').classList.add('active');
            document.getElementById('selector-color').style.display = 'grid';
        } else {
            alert('Por favor, introduce un número válido de minutos');
        }
    }

    function seleccionarColor(color) {
        colorElegido = color;
        document.querySelectorAll('#selector-color .btn-tiempo').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
    }

    function iniciarPartida() {
        let incremento = document.getElementById('incremento').value;
        if (tiempoPersonalizadoActivo) {
            const input = document.getElementById('minutosPersonalizados');
            const valor = parseInt(input.value);
            if (valor && valor > 0) tiempoElegido = valor;
        }
        if (tiempoElegido === 0) {
            alert("Por favor, selecciona un tiempo.");
            return;
        }

        document.getElementById('btn-jugar').disabled = true;
        document.getElementById('mensaje-espera').style.display = 'block';
        document.getElementById('btn-cancelar').style.display = 'block';

        localStorage.setItem('tiempoPartida', tiempoElegido);
        localStorage.setItem('incrementoPartida', incremento);
        localStorage.setItem('colorElegido', colorElegido);

        let nickJugador = localStorage.getItem('nickJugador') || 'Anónimo';
        let paisJugador = localStorage.getItem('paisJugador') || 'ES';

        socket.emit('buscar_partida', {
            tiempo: tiempoElegido,
            incremento: incremento,
            color: colorElegido,
            usuario: nickJugador,
            pais: paisJugador
        });
        buscandoPartida = true;
    }

    socket.on('partida_encontrada', function(data) {
        console.log('✅ Partida encontrada:', data);
        document.getElementById('btn-cancelar').style.display = 'none';
        localStorage.setItem('salaId', data.sala);
        localStorage.setItem('miColor', data.color);
        localStorage.setItem('rivalNick', data.rival_nick || 'Rival');
        localStorage.setItem('miElo', data.mi_elo || 1200);
        localStorage.setItem('rivalElo', data.rival_elo || 1200);
        window.location.href = "tablero.html";
    });
    
    socket.on('esperando_rival', function(data) {
        document.getElementById('mensaje-espera').innerText = '⏳ ' + data.mensaje;
    });
    
    function cancelarBusqueda() {
        socket.emit('cancelar_busqueda');
        document.getElementById('btn-jugar').disabled = false;
        document.getElementById('mensaje-espera').style.display = 'none';
        document.getElementById('btn-cancelar').style.display = 'none';
        buscandoPartida = false;
    }

    socket.on('actualizar_cola_espera', function(cola) {
        const lista = document.getElementById('lista-jugadores');
        const miNick = localStorage.getItem('nickJugador') || 'Anónimo';
        
        if (!cola || cola.length === 0) {
            lista.innerHTML = '<p style="color: #666; text-align: center; padding: 20px;">No hay jugadores en espera.</p>';
            return;
        }
        
        let html = '';
        let hayOtros = false;
        
        cola.forEach(function(jugador) {
            if (jugador.nick === miNick) return;
            hayOtros = true;
            
            var elo = jugador.elo || 1200;
            var eloClass = elo < 1000 ? '#888' : elo < 1400 ? '#4CAF50' : elo < 1800 ? '#2196F3' : elo < 2200 ? '#ff9800' : '#f44336';
            var pais = jugador.pais || 'OT';
            var bandera = banderas[pais] || '🌍';
            var colorTexto = jugador.color === 'white' ? 'Blancas ♔' : jugador.color === 'black' ? 'Negras ♚' : 'Aleatorio 🎲';
            
            html += `<div class="jugador-cola" onclick="unirseARival('${jugador.id}', '${jugador.nick}', ${jugador.tiempo}, ${jugador.incremento})">
                <div class="jugador-info">
                    <span class="jugador-nick">${bandera} ${jugador.nick}</span>
                    <span class="jugador-elo" style="color: ${eloClass}">🏆 ELO: ${elo}</span>
                    <span class="jugador-ritmo">⏱️ ${jugador.tiempo}+${jugador.incremento}s | ${colorTexto}</span>
                </div>
                <button class="btn-unirse">Jugar</button>
            </div>`;
        });
        
        lista.innerHTML = hayOtros ? html : '<p style="color: #666; text-align: center; padding: 20px;">No hay otros jugadores en espera.</p>';
    });

    function unirseARival(rivalId, rivalNick, tiempo, incremento) {
        if (buscandoPartida) {
            alert('⚠️ Cancela tu búsqueda actual antes de unirte a otro jugador.');
            return;
        }
        localStorage.setItem('tiempoPartida', tiempo);
        localStorage.setItem('incrementoPartida', incremento);
        localStorage.setItem('colorElegido', 'random');
        socket.emit('unirse_a_rival', { rival_id: rivalId });
    }

    socket.on('error_unirse', function(data) {
        alert('⚠️ ' + data.mensaje);
    });
</script>
</body>
</html>
