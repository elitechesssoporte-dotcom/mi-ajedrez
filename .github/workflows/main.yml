name: Keep FighterChess Awake

on:
  schedule:
    # Se ejecuta cada 10 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  wake-up-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FighterChess
        run: |
          curl -I https://www.fighterchess.es
          echo "✅ FighterChess despertado con éxito"
