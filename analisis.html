<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Análisis - FighterChess</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { background: #050505; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 20px; }
        .contenedor { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .columna-tablero { display: flex; flex-direction: column; align-items: center; }
        .tablero-area { display: flex; }
        .barra-eval { width: 30px; height: 400px; background: #333; border-radius: 5px; overflow: hidden; position: relative; }
        .eval-blanca { background: white; width: 100%; height: 50%; position: absolute; bottom: 0; transition: height 0.5s; }
        #miTablero { width: 400px; }
        .panel-control { width: 300px; background: #111; padding: 20px; border-radius: 10px; }
        input, textarea { width: 100%; padding: 8px; margin-bottom: 10px; background: #222; color: white; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #d4af37; border: none; cursor: pointer; border-radius: 4px; margin-right: 5px; margin-bottom: 5px; font-weight: bold; }
        button:hover { background: #e5c158; }
        .btn-volver { background: #333; color: white; }
        #resultadoEval { margin-top: 15px; color: #d4af37; font-size: 1.1em; }
        #mejorJugada { color: #4ade80; font-weight: bold; }
        h2 { color: #d4af37; }
        .nav-container { margin-top: 15px; background: #111; padding: 12px; border-radius: 10px; width: 430px; text-align: center; }
        .nav-container button { padding: 12px 18px; font-size: 1.1em; }
        #contadorJugadas { margin-top: 10px; color: #d4af37; font-size: 0.95em; }
        .mate-aviso { color: #ff4444; font-weight: bold; font-size: 1.2em; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .profundidad { color: #888; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="columna-tablero">
            <div class="tablero-area">
                <div class="barra-eval"><div class="eval-blanca" id="barraBlanca"></div></div>
                <div id="miTablero"></div>
            </div>
            
            <div class="nav-container">
                <button onclick="irAlInicio()">⏮️ Inicio</button>
                <button onclick="jugadaAnterior()">◀️ Atrás</button>
                <button onclick="jugadaSiguiente()">▶️ Siguiente</button>
                <button onclick="irAlFinal()">️ Final</button>
                <p id="contadorJugadas">Jugada 0 de 0</p>
            </div>
        </div>
        
        <div class="panel-control">
            <h2>🔍 Sala de Análisis</h2>
            
            <p><strong>Pegar posición (FEN):</strong></p>
            <input type="text" id="fenInput" value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">
            
            <p><strong>O pegar PGN de partida:</strong></p>
            <textarea id="pgnInput" rows="4" placeholder="1. e4 e5 2. Nf3 Nc6..."></textarea>
            
            <div>
                <button onclick="cargarFEN()">📋 Cargar FEN</button>
                <button onclick="cargarPGN()">📄 Cargar PGN</button>
            </div>
            
            <div style="margin-top: 15px;">
                <button onclick="iniciarAnalisis()">▶️ Analizar</button>
                <button onclick="detenerAnalisis()">⏹️ Detener</button>
            </div>
            
            <p id="resultadoEval">Evaluación: Esperando...</p>
            <p id="mejorJugada"></p>
            <p class="profundidad" id="profundidadInfo"></p>
            
            <button class="btn-volver" onclick="window.location.href='configuracion.html'">⬅️ Volver</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <script>
        var game = new Chess();
        var board = null;
        var stockfish = null;
        var analizando = false;
        var stockfishListo = false;
        var mateDetectado = false;
        
        var historialCompleto = [];
        var indiceActual = 0;

        function onDragStart(source, piece) {
            if (game.game_over()) return false;
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) return false;
        }

        function onDrop(source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            
            historialCompleto = game.history({ verbose: true });
            indiceActual = historialCompleto.length;
            actualizarContador();
            actualizarFEN();
            
            // ✅ DETECTAR MATE O TABLAS INMEDIATAMENTE
            if (game.in_checkmate()) {
                detenerAnalisis();
                var ganador = game.turn() === 'w' ? 'Negras' : 'Blancas';
                document.getElementById('resultadoEval').innerHTML = '<span class="mate-aviso">♚ ¡JAQUE MATE! Ganan ' + ganador + '</span>';
                document.getElementById('mejorJugada').innerText = '';
                document.getElementById('profundidadInfo').innerText = '';
            } else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
                detenerAnalisis();
                document.getElementById('resultadoEval').innerText = '🤝 Tablas';
                document.getElementById('mejorJugada').innerText = '';
                document.getElementById('profundidadInfo').innerText = '';
            } else if (analizando) {
                // Reiniciar análisis en la nueva posición
                setTimeout(iniciarAnalisis, 200);
            }
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        
        board = Chessboard('miTablero', config);

        function cargarStockfish() {
            try {
                stockfish = new Worker('stockfish.js');
                
                stockfish.onmessage = function(event) {
                    var line = event.data;
                    
                    if (line === 'uciok') {
                        stockfish.postMessage('setoption name Hash value 512');
                        stockfish.postMessage('setoption name MultiPV value 1');
                        stockfish.postMessage('isready');
                        return;
                    }
                    
                    if (line === 'readyok') {
                        stockfishListo = true;
                        console.log('✅ Stockfish listo');
                        document.getElementById('resultadoEval').innerText = 'Motor listo. Dale a Analizar.';
                        return;
                    }
                    
                    if (!analizando) return;
                    
                    // ✅ DETECTAR MATE FORZADO (Stockfish lo ve antes que el tablero)
                    if (line.includes('mate')) {
                        var mateMatch = line.match(/mate (-?\d+)/);
                        if (mateMatch) {
                            var movimientosMate = parseInt(mateMatch[1]);
                            detenerAnalisis();
                            mateDetectado = true;
                            
                            if (movimientosMate > 0) {
                                document.getElementById('resultadoEval').innerHTML = 
                                    '<span class="mate-aviso"> Mate en ' + movimientosMate + ' (Blancas)</span>';
                            } else {
                                document.getElementById('resultadoEval').innerHTML = 
                                    '<span class="mate-aviso">♚ Mate en ' + Math.abs(movimientosMate) + ' (Negras)</span>';
                            }
                            document.getElementById('mejorJugada').innerText = '';
                            document.getElementById('profundidadInfo').innerText = 'Mate detectado por Stockfish';
                            return;
                        }
                    }
                    
                                        // ✅ EVALUACIÓN NORMAL (centipawns)
                    if (line.startsWith('info') && line.includes('score cp')) {
                        var match = line.match(/score cp (-?\d+)/);
                        if (match) {
                            var score = parseInt(match[1]);
                            
                            // ⚠️ NO INVERTIR: Stockfish siempre da desde perspectiva de blancas
                            // + = ventaja blancas, - = ventaja negras (siempre)
                            
                            // Actualizar barra de evaluación
                            var evalPct = 50 + (score / 10);
                            evalPct = Math.max(5, Math.min(95, evalPct));
                            document.getElementById('barraBlanca').style.height = evalPct + '%';
                            
                            // Mostrar evaluación con signo
                            var signo = score >= 0 ? '+' : '';
                            var evalTexto = signo + (score / 100).toFixed(2);
                            document.getElementById('resultadoEval').innerText = 'Evaluación: ' + evalTexto;
                        }
                    }
                    
                    // ✅ MEJOR JUGADA (solo la línea principal, multipv 1)
                    if (line.startsWith('info') && line.includes('multipv 1') && line.includes(' pv ')) {
                        var pvMatch = line.match(/ pv ([a-h][1-8][a-h][1-8][qrbn]?)/);
                        if (pvMatch) {
                            document.getElementById('mejorJugada').innerText = 'Mejor jugada: ' + pvMatch[1];
                        }
                    }
                    
                    // ✅ MOSTRAR PROFUNDIDAD ACTUAL
                    if (line.startsWith('info') && line.includes('depth')) {
                        var depthMatch = line.match(/depth (\d+)/);
                        if (depthMatch) {
                            document.getElementById('profundidadInfo').innerText = 'Profundidad: ' + depthMatch[1];
                        }
                    }
                };
                
                stockfish.postMessage('uci');
                console.log('🔄 Cargando Stockfish...');
            } catch (e) {
                console.error('❌ Error al cargar Stockfish:', e);
                document.getElementById('resultadoEval').innerText = '❌ Error: stockfish.js no encontrado';
            }
        }

        function actualizarFEN() {
            document.getElementById('fenInput').value = game.fen();
        }

        function actualizarContador() {
            var total = historialCompleto.length;
            document.getElementById('contadorJugadas').innerText = 'Jugada ' + indiceActual + ' de ' + total;
        }

        function irAlInicio() {
            game.reset();
            board.position('start');
            indiceActual = 0;
            actualizarFEN();
            actualizarContador();
            detenerAnalisis();
            mateDetectado = false;
            document.getElementById('resultadoEval').innerText = 'Evaluación: Esperando...';
            document.getElementById('mejorJugada').innerText = '';
            document.getElementById('profundidadInfo').innerText = '';
        }

        function jugadaAnterior() {
            if (indiceActual > 0 && historialCompleto.length > 0) {
                game.reset();
                for (var i = 0; i < indiceActual - 1; i++) {
                    game.move(historialCompleto[i]);
                }
                board.position(game.fen());
                indiceActual--;
                actualizarFEN();
                actualizarContador();
                detenerAnalisis();
                mateDetectado = false;
                document.getElementById('resultadoEval').innerText = 'Evaluación: Esperando...';
                document.getElementById('mejorJugada').innerText = '';
                document.getElementById('profundidadInfo').innerText = '';
            }
        }

        function jugadaSiguiente() {
            if (indiceActual < historialCompleto.length) {
                game.move(historialCompleto[indiceActual]);
                indiceActual++;
                board.position(game.fen());
                actualizarFEN();
                actualizarContador();
                detenerAnalisis();
                mateDetectado = false;
                document.getElementById('resultadoEval').innerText = 'Evaluación: Esperando...';
                document.getElementById('mejorJugada').innerText = '';
                document.getElementById('profundidadInfo').innerText = '';
            }
        }

        function irAlFinal() {
            game.reset();
            for (var i = 0; i < historialCompleto.length; i++) {
                game.move(historialCompleto[i]);
            }
            board.position(game.fen());
            indiceActual = historialCompleto.length;
            actualizarFEN();
            actualizarContador();
            detenerAnalisis();
            mateDetectado = false;
            document.getElementById('resultadoEval').innerText = 'Evaluación: Esperando...';
            document.getElementById('mejorJugada').innerText = '';
            document.getElementById('profundidadInfo').innerText = '';
        }

        function cargarFEN() {
            var fen = document.getElementById('fenInput').value.trim();
            if (!fen) {
                alert('❌ El campo FEN está vacío');
                return;
            }
            try {
                game.load(fen);
                board.position(fen);
                actualizarFEN();
                historialCompleto = [];
                indiceActual = 0;
                actualizarContador();
                detenerAnalisis();
                mateDetectado = false;
                document.getElementById('resultadoEval').innerText = 'Evaluación: Esperando...';
                document.getElementById('mejorJugada').innerText = '';
                document.getElementById('profundidadInfo').innerText = '';
            } catch (e) {
                alert('❌ FEN no válido');
            }
        }

        function cargarPGN() {
            var pgn = document.getElementById('pgnInput').value.trim();
            if (!pgn) {
                alert('❌ El campo PGN está vacío');
                return;
            }
            try {
                var tempGame = new Chess();
                var loaded = tempGame.load_pgn(pgn);
                
                if (loaded) {
                    historialCompleto = tempGame.history({ verbose: true });
                    game.reset();
                    board.position('start');
                    indiceActual = 0;
                    actualizarFEN();
                    actualizarContador();
                    detenerAnalisis();
                    mateDetectado = false;
                    document.getElementById('resultadoEval').innerText = 'Evaluación: Esperando...';
                    document.getElementById('mejorJugada').innerText = '';
                    document.getElementById('profundidadInfo').innerText = '';
                } else {
                    alert('❌ No se pudo cargar el PGN. Revisa el formato.');
                }
            } catch (e) {
                alert('❌ Error al cargar PGN: ' + e.message);
            }
        }

        function iniciarAnalisis() {
            // ✅ VERIFICAR SI YA HAY MATE O TABLAS
            if (game.in_checkmate()) {
                var ganador = game.turn() === 'w' ? 'Negras' : 'Blancas';
                document.getElementById('resultadoEval').innerHTML = '<span class="mate-aviso">♚ ¡JAQUE MATE! Ganan ' + ganador + '</span>';
                document.getElementById('mejorJugada').innerText = '';
                document.getElementById('profundidadInfo').innerText = '';
                return;
            }
            
            if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
                document.getElementById('resultadoEval').innerText = '🤝 Tablas';
                document.getElementById('mejorJugada').innerText = '';
                document.getElementById('profundidadInfo').innerText = '';
                return;
            }
            
            if (mateDetectado) {
                return; // Ya detectamos mate, no seguir analizando
            }
            
            if (!stockfish) {
                cargarStockfish();
                setTimeout(iniciarAnalisis, 1000);
                return;
            }
            
            if (!stockfishListo) {
                document.getElementById('resultadoEval').innerText = "⏳ Cargando motor...";
                setTimeout(iniciarAnalisis, 500);
                return;
            }
            
            // Detener análisis anterior y empezar nuevo
            stockfish.postMessage('stop');
            analizando = true;
            document.getElementById('mejorJugada').innerText = "Calculando...";
            document.getElementById('resultadoEval').innerText = " Analizando...";
            document.getElementById('profundidadInfo').innerText = '';
            
            // ✅ SIN TIMEOUT: Calcular hasta que Stockfish encuentre mate o el usuario pare
            stockfish.postMessage('position fen ' + game.fen());
            stockfish.postMessage('go infinite');
        }

        function detenerAnalisis() {
            analizando = false;
            if (stockfish) {
                stockfish.postMessage('stop');
            }
        }

        window.onload = function() {
            cargarStockfish();
            actualizarContador();
        };
    </script>
</body>
</html>
