<!DOCTYPE html>
<html lang="es">
<head>
<!-- Código para que sea una App (PWA) -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#050505">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <meta charset="UTF-8">
    <!-- ✅ VIEWPORT BLINDADO: Sin zoom, sin scroll, cubre toda la pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FighterChess - Portada</title>
    <style>
        /* --- ESTILOS DE RESET Y GENERALES --- */
        :root {
            --bg-color: #050505;
            --gold-title: #d4af37;
            --silver-text: #c0c0c0;
            --mostaza-btn: #c4a028;
            --mostaza-hover: #b18a1a;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --font-title: 'Georgia', 'Times New Roman', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Quita el flash azul al tocar en móvil */
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--silver-text);
            height: 100vh;
            height: 100dvh; /* ✅ Altura dinámica para móviles (evita que la barra del navegador tape cosas) */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none; /* ✅ Bloquea gestos de zoom/pan del navegador */
        }

        .main-wrapper {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            width: 100%;
        }

        .corona-icon {
            font-size: 5rem;
            color: var(--silver-text);
            text-shadow: 
                0 0 10px rgba(192, 192, 192, 0.4),
                0 0 5px rgba(255, 255, 255, 0.2);
            line-height: 1;
        }

        .title-elite {
            font-family: var(--font-title);
            font-size: 3.5rem;
            text-transform: uppercase;
            color: var(--gold-title);
            text-shadow: 
                0 0 15px rgba(212, 175, 55, 0.5),
                0 0 5px rgba(212, 175, 55, 0.2);
            font-weight: 700;
            letter-spacing: 3px;
            line-height: 1.1;
        }

        .subtitle-elite {
            font-size: 1rem;
            text-transform: uppercase;
            color: var(--silver-text);
            font-weight: 300;
            letter-spacing: 5px;
            margin-top: -5px;
        }

        .cta-button {
            display: inline-block;
            margin-top: 10px;
            padding: 18px 45px;
            font-size: 1.1rem;
            text-transform: uppercase;
            text-decoration: none;
            background-color: var(--mostaza-btn);
            color: black;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(196, 160, 40, 0.3);
        }

        .cta-button:active {
            transform: scale(0.95); /* Efecto de presión en móvil */
        }

        .soporte-contacto {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%); /* ✅ Centrado en móvil para que no se corte */
            font-size: 0.95rem;
            color: var(--gold-title);
            font-weight: 600;
            opacity: 1;
            z-index: 1000;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.3s ease, transform 0.2s ease;
            width: 90%;
            justify-content: center;
            text-align: center;
            /* ✅ Zona segura para que no lo tape la barra de gestos del iPhone/Android */
            padding-bottom: env(safe-area-inset-bottom, 20px); 
        }

        .soporte-contacto:active {
            transform: translateX(-50%) scale(0.95);
            opacity: 0.8;
        }

        /* --- ✅ OPTIMIZACIÓN ESPECÍFICA PARA MÓVIL --- */
        @media (max-width: 768px) {
            .corona-icon {
                font-size: 3.5rem; /* Más pequeño para que quepa */
            }
            .title-elite {
                font-size: 2.2rem; /* Ajustado para pantallas estrechas */
                letter-spacing: 1px;
            }
            .subtitle-elite {
                font-size: 0.75rem;
                letter-spacing: 2px;
            }
            .cta-button {
                padding: 16px 40px;
                font-size: 1rem;
                width: 80%; /* Botón más ancho y fácil de tocar */
                max-width: 300px;
            }
            .soporte-contacto {
                font-size: 0.85rem;
                bottom: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="corona-icon">♔</div> 
        <h1 class="title-elite">FIGHTERCHESS</h1>
        <p class="subtitle-elite">AJEDREZ FIGHTER</p>
        <a href="login.html" class="cta-button">LOGIN</a>
    </div>

    <a href="mailto:elitechess.soporte@gmail.com" class="soporte-contacto">
        📧 elitechess.soporte@gmail.com
    </a>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('✅ App registrada correctamente'))
        .catch(err => console.log('❌ Error al registrar la app:', err));
    });
  }
</script>
</body>
</html>
